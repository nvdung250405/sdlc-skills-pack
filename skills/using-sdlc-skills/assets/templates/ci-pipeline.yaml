# ==============================================================================
# Canonical Artifact Template: CI/CD Pipeline Automation (GitHub Actions)
# Stage: 8. Release & Deployment / 13. Platform & DevEx
# Primary Owner Skill: ci-cd-and-automation, shipping-and-launch
# Purpose: Declarative CI workflow enforcing pack quality gates: linting, contract check, tests, and build.
# Verification Gate: yamllint <path> (or action-validator / CI run)
# ==============================================================================

name: CI Quality Gate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-validate:
    name: 1. Lint & Contract Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Code style & syntax linter
        run: npm run lint

      - name: API contract schema check
        run: |
          if [ -f "contracts/openapi.yaml" ]; then
            npx @stoplight/spectral-cli lint contracts/openapi.yaml
          fi

  unit-and-integration-tests:
    name: 2. Automated Tests & Coverage
    runs-on: ubuntu-latest
    needs: [lint-and-validate]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test runtime
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm test -- --coverage --ci

  security-audit:
    name: 3. Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Dependency Audit
        run: npm audit --audit-level=high

  build-and-package:
    name: 4. Build Artifact Container
    runs-on: ubuntu-latest
    needs: [unit-and-integration-tests, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
