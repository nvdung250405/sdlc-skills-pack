# ==============================================================================
# Canonical Artifact Template: Query Interface Contract (GraphQL SDL)
# Stage: 3. Architecture & System Design
# Primary Owner Skill: api-and-interface-design
# Purpose: Machine-executable contract for GraphQL schemas, types, queries, and mutations.
# Verification Gate: npx @graphql-inspector/cli validate <path> (or graphql-schema-linter)
# ==============================================================================

"""
Core schema root operations
"""
schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# -----------------------------------------------------------------------------
# Query Definitions
# -----------------------------------------------------------------------------

type Query {
  """
  Retrieve a single resource by its unique UUID. Returns null if not found.
  """
  resource(id: ID!): Resource

  """
  Retrieve a paginated collection of resources with optional status filtering.
  """
  resources(
    filter: ResourceFilterInput
    pagination: PaginationInput = { page: 1, limit: 20 }
  ): ResourceConnection!
}

# -----------------------------------------------------------------------------
# Mutation Definitions
# -----------------------------------------------------------------------------

type Mutation {
  """
  Create a new resource entity with validation constraints.
  """
  createResource(input: CreateResourceInput!): CreateResourcePayload!

  """
  Update an existing resource entity.
  """
  updateResource(id: ID!, input: UpdateResourceInput!): UpdateResourcePayload!

  """
  Idempotent deletion of a resource.
  """
  deleteResource(id: ID!): DeleteResourcePayload!
}

# -----------------------------------------------------------------------------
# Subscription Definitions
# -----------------------------------------------------------------------------

type Subscription {
  """
  Real-time event stream published when a resource state transitions.
  """
  resourceUpdated(id: ID): Resource!
}

# -----------------------------------------------------------------------------
# Core Object Types & Enums
# -----------------------------------------------------------------------------

"""
Domain entity representing a managed resource.
"""
type Resource {
  id: ID!
  name: String!
  description: String
  status: ResourceStatus!
  createdAt: String!
  updatedAt: String!
}

enum ResourceStatus {
  DRAFT
  ACTIVE
  ARCHIVED
}

type ResourceConnection {
  nodes: [Resource!]!
  totalCount: Int!
  pageInfo: PageInfo!
}

type PageInfo {
  currentPage: Int!
  totalPages: Int!
  hasNextPage: Boolean!
}

# -----------------------------------------------------------------------------
# Input Types
# -----------------------------------------------------------------------------

input PaginationInput {
  page: Int = 1
  limit: Int = 20
}

input ResourceFilterInput {
  status: ResourceStatus
  searchTerm: String
}

input CreateResourceInput {
  name: String!
  description: String
}

input UpdateResourceInput {
  name: String
  description: String
  status: ResourceStatus
}

# -----------------------------------------------------------------------------
# Mutation Payloads with Consistent Error Handling
# -----------------------------------------------------------------------------

type CreateResourcePayload {
  resource: Resource
  userErrors: [UserError!]!
}

type UpdateResourcePayload {
  resource: Resource
  userErrors: [UserError!]!
}

type DeleteResourcePayload {
  success: Boolean!
  userErrors: [UserError!]!
}

type UserError {
  field: [String!]
  message: String!
  code: String!
}

