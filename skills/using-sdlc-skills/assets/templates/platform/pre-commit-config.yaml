# ==============================================================================
# Canonical Artifact Template: Pre-commit Hygiene Configuration
# Stage: 13. Platform & Developer Experience (cross-cutting)
# Primary Owner Skill: setup-pre-commit, git-guardrails-claude-code
# Purpose: Pre-commit hooks blocking syntax errors, secrets leaks, and formatting flaws before commit.
# Verification Gate: pre-commit run --all-files
# ==============================================================================

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        language_version: python3

