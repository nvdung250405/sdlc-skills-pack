# ==============================================================================
# Canonical Artifact Template: REST API Contract (OpenAPI 3.1)
# Stage: 3. Architecture & System Design
# Primary Owner Skill: api-and-interface-design
# Purpose: Machine-executable contract for REST/HTTP APIs, powering linting, mocking, client generation and contract testing.
# Verification Gate: npx @stoplight/spectral-cli lint <path> (or vacuum lint <path>)
# ==============================================================================

openapi: 3.1.0
info:
  title: "[SERVICE_NAME] API"
  summary: "Authoritative interface contract for [SERVICE_NAME]"
  description: |
    Machine-executable API contract defining endpoints, payloads, error envelopes,
    and security boundaries. Adheres to contract-first principles and consistent error semantics.
  version: "1.0.0"
  contact:
    name: "[TEAM_OR_OWNER]"
    email: "team@example.com"
  license:
    name: "Proprietary / Internal"

servers:
  - url: "https://api.example.com/v1"
    description: "Production Server"
  - url: "https://staging-api.example.com/v1"
    description: "Staging / Verification Environment"
  - url: "http://localhost:8080/v1"
    description: "Local Development Server"

tags:
  - name: "Core"
    description: "Primary resource operations"

paths:
  /resources:
    get:
      summary: "List resources"
      description: "Retrieve a paginated list of resources matching optional filters."
      operationId: "listResources"
      tags: ["Core"]
      parameters:
        - name: "page"
          in: "query"
          required: false
          description: "Page index (1-based)"
          schema:
            type: "integer"
            minimum: 1
            default: 1
        - name: "limit"
          in: "query"
          required: false
          description: "Maximum items per page"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: "Paginated resource collection"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResourceList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: "Create resource"
      description: "Create a new resource with server-generated fields and explicit validation."
      operationId: "createResource"
      tags: ["Core"]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
      responses:
        "201":
          description: "Resource created successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /resources/{id}:
    parameters:
      - name: "id"
        in: "path"
        required: true
        description: "Unique resource identifier"
        schema:
          type: "string"
          format: "uuid"
    get:
      summary: "Get resource by ID"
      operationId: "getResourceById"
      tags: ["Core"]
      responses:
        "200":
          description: "Resource details"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    patch:
      summary: "Update resource (partial)"
      operationId: "updateResource"
      tags: ["Core"]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateResourceRequest"
      responses:
        "200":
          description: "Updated resource"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      summary: "Delete resource (idempotent)"
      operationId: "deleteResource"
      tags: ["Core"]
      security:
        - BearerAuth: []
      responses:
        "204":
          description: "Resource deleted or already absent"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "JWT Bearer access token"

  schemas:
    Resource:
      type: "object"
      required:
        - "id"
        - "name"
        - "status"
        - "createdAt"
        - "updatedAt"
      properties:
        id:
          type: "string"
          format: "uuid"
          example: "a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11"
        name:
          type: "string"
          minLength: 1
          maxLength: 255
          example: "Sample Resource"
        description:
          type: "string"
          maxLength: 2000
          nullable: true
          example: "Detailed context regarding resource"
        status:
          type: "string"
          enum: ["draft", "active", "archived"]
          default: "draft"
        createdAt:
          type: "string"
          format: "date-time"
        updatedAt:
          type: "string"
          format: "date-time"

    CreateResourceRequest:
      type: "object"
      required:
        - "name"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 255
        description:
          type: "string"
          maxLength: 2000
          nullable: true

    UpdateResourceRequest:
      type: "object"
      properties:
        name:
          type: "string"
          minLength: 1
          maxLength: 255
        description:
          type: "string"
          maxLength: 2000
          nullable: true
        status:
          type: "string"
          enum: ["draft", "active", "archived"]

    PaginatedResourceList:
      type: "object"
      required:
        - "items"
        - "pagination"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/Resource"
        pagination:
          $ref: "#/components/schemas/PaginationMetadata"

    PaginationMetadata:
      type: "object"
      required:
        - "page"
        - "limit"
        - "totalItems"
        - "totalPages"
      properties:
        page:
          type: "integer"
          example: 1
        limit:
          type: "integer"
          example: 20
        totalItems:
          type: "integer"
          example: 42
        totalPages:
          type: "integer"
          example: 3

    # Standard Error Envelope (api-and-interface-design rule)
    ErrorEnvelope:
      type: "object"
      required:
        - "error"
      properties:
        error:
          type: "object"
          required:
            - "code"
            - "message"
          properties:
            code:
              type: "string"
              description: "Machine-readable error identifier"
              example: "VALIDATION_FAILED"
            message:
              type: "string"
              description: "Human-readable diagnostic description"
              example: "The request body failed validation constraints."
            details:
              type: "array"
              description: "Contextual issue list when applicable"
              items:
                type: "object"
                required:
                  - "field"
                  - "issue"
                properties:
                  field:
                    type: "string"
                    example: "name"
                  issue:
                    type: "string"
                    example: "Field must not be empty"

  responses:
    BadRequestError:
      description: "Invalid request payload or malformed syntax"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnauthorizedError:
      description: "Missing or invalid authentication credentials"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFoundError:
      description: "Requested resource was not found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ValidationError:
      description: "Semantic validation failure (field constraints)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    InternalServerError:
      description: "Unexpected internal server failure"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
